  // ---------- BACA KTP/PASPOR DI PERANGKAT (Tesseract di browser, keputusan PO 26 Okt 2026) ----------
  // Growth ke atas tanpa API key Gemini: foto dibaca di browser (tesseract.js 5.1.1, WebAssembly), hanya teksnya yang dikirim
  // ke server untuk diurai (POST /ocr/mrz, /ocr/ktp-teks). Dengan API key: jalur Gemini lama ("mode akurat").
  // Starter / staf tanpa OCR_USE: GET /ocr/mode -> tersedia false, Tambah Jamaah langsung membuka form.
  // Berkas (sekitar 4 MB mesin + 2 MB data KTP atau 5 MB data paspor) dimuat saat scan pertama, lalu disimpan browser.
  const TESS = {
    js: "/assets/vendor/tesseract.js@5.1.1/tesseract.min.js",
    worker: "/assets/vendor/tesseract.js@5.1.1/worker.min.js",
    core: "/assets/vendor/tesseract.js-core@5.1.1",
    lang: "/assets/vendor/tessdata@4.0.0_best_int",
  };
  const OCR_JENIS = {
    // MRZ: dua baris huruf besar, angka, dan "<" di bawah halaman biodata; bahasa eng (data ind tidak mengenal "<")
    paspor: { lang: "eng", param: { tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<", tessedit_pageseg_mode: "6" } },
    // KTP: blok teks baris per baris supaya label dan nilainya tetap satu baris
    ktp: { lang: "ind", param: { tessedit_pageseg_mode: "6" } },
  };
  let ocrInfoJanji = null;
  let tessMuat = null;
  const tessPekerja = {};
  let ocrProgres = null; // callback progres untuk scan yang sedang berjalan

  // { tersedia, mode: "gemini" | "perangkat" | null } - disimpan selama halaman terbuka; gagal = coba lagi lain kali
  window.ocrInfo = function () {
    if (!ocrInfoJanji) {
      ocrInfoJanji = KU.erp.ocrMode()
        .then((r) => (r.success ? r.data : { tersedia: false, mode: null }))
        .catch(() => { ocrInfoJanji = null; return { tersedia: false, mode: null }; });
    }
    return ocrInfoJanji;
  };

  function muatTesseract() {
    if (window.Tesseract) return Promise.resolve();
    if (!tessMuat) {
      tessMuat = new Promise((selesai, gagal) => {
        const s = document.createElement("script");
        s.src = TESS.js;
        s.onload = () => selesai();
        s.onerror = () => { tessMuat = null; gagal(new Error("muat")); };
        document.head.appendChild(s);
      });
    }
    return tessMuat;
  }

  const PESAN_TAHAP = {
    "loading tesseract core": "Memuat pembaca teks",
    "initializing tesseract": "Menyiapkan pembaca teks",
    "loading language traineddata": "Memuat data bahasa",
    "initializing api": "Menyiapkan pembaca teks",
    "recognizing text": "Membaca teks",
  };

  // Batas waktu per tahap. Tanpa batas, worker yang macet membuat panel menunggu selamanya.
  const BATAS_MUAT = 90000, BATAS_BACA = 120000;
  function denganBatas(janji, ms, kode) {
    let t;
    return Promise.race([janji, new Promise((_, gagal) => { t = setTimeout(() => gagal(new Error(kode)), ms); })])
      .finally(() => clearTimeout(t));
  }

  async function pekerjaOcr(jenis) {
    if (!tessPekerja[jenis]) {
      tessPekerja[jenis] = (async () => {
        await muatTesseract();
        const cfg = OCR_JENIS[jenis];
        // tesseract.js 5 melempar galat worker ke halaman bila tanpa errorHandler, dan crash saat inisialisasi tidak menolak
        // janji createWorker. errorHandler meneruskannya ke sini.
        let tolakInit;
        const gagalInit = new Promise((_, gagal) => { tolakInit = gagal; });
        // workerBlobURL:false = worker dimuat langsung dari /assets (CSP worker-src 'self'); gzip:false = data tanpa .gz.
        // cacheMethod "none": cache IndexedDB bawaan kadang menggantung di "Memuat data bahasa" (terulang di uji 26 Okt 2026);
        // berkas tetap disimpan cache HTTP browser, jadi scan berikutnya tidak mengunduh ulang.
        const w = await denganBatas(Promise.race([Tesseract.createWorker(cfg.lang, 1, {
          workerPath: TESS.worker, corePath: TESS.core, langPath: TESS.lang, gzip: false, workerBlobURL: false, cacheMethod: "none",
          logger: (m) => ocrProgres?.(m),
          errorHandler: (e) => tolakInit(e instanceof Error ? e : new Error(String(e))),
        }), gagalInit]), BATAS_MUAT, "batas-muat");
        await w.setParameters(cfg.param);
        return w;
      })().catch((e) => { delete tessPekerja[jenis]; throw e; });
    }
    return tessPekerja[jenis];
  }

  // Baca satu gambar dengan batas waktu; worker yang melewati batas dihentikan supaya scan berikutnya mulai bersih
  async function bacaTeks(jenis, w, kanvas) {
    try {
      return (await denganBatas(w.recognize(kanvas), BATAS_BACA, "batas-baca")).data.text;
    } catch (e) {
      if (e.message === "batas-baca") { delete tessPekerja[jenis]; w.terminate().catch(() => {}); }
      throw e;
    }
  }

  // Foto -> kanvas abu-abu dengan kontras diregangkan (1% tergelap -> hitam, 1% terterang -> putih), lebar sekitar 1800 px.
  // bawah = bagian bawah gambar saja (area MRZ paspor), dalam pecahan tinggi.
  async function siapkanGambar(file, { bawah = 0, lebar = 1800 } = {}) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((selesai, gagal) => { const i = new Image(); i.onload = () => selesai(i); i.onerror = gagal; i.src = url; });
      let sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
      if (bawah) { sy = Math.round(sh * (1 - bawah)); sh -= sy; }
      const skala = lebar / sw;
      const cv = document.createElement("canvas");
      cv.width = Math.round(sw * skala);
      cv.height = Math.max(1, Math.round(sh * skala));
      const c = cv.getContext("2d", { willReadFrequently: true });
      c.imageSmoothingQuality = "high";
      c.drawImage(img, 0, sy, sw, sh, 0, 0, cv.width, cv.height);
      const d = c.getImageData(0, 0, cv.width, cv.height), p = d.data, hist = new Array(256).fill(0);
      for (let i = 0; i < p.length; i += 4) { const g = Math.round(0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]); p[i] = g; hist[g]++; }
      const n = p.length / 4;
      let lo = 0, hi = 255, a = 0;
      for (; lo < 255 && (a += hist[lo]) < n * 0.01; lo++);
      a = 0;
      for (; hi > 0 && (a += hist[hi]) < n * 0.01; hi--);
      const r = Math.max(1, hi - lo);
      for (let i = 0; i < p.length; i += 4) { const g = Math.min(255, Math.max(0, ((p[i] - lo) * 255) / r)); p[i] = p[i + 1] = p[i + 2] = g; }
      c.putImageData(d, 0, 0);
      return cv;
    } finally { URL.revokeObjectURL(url); }
  }

  // Baca foto di perangkat lalu urai teksnya di server. Hasil = respons API { success, data: { fields, warnings, mrz? } }.
  // onStatus(pesan) dipanggil untuk tahap dan persen baca.
  window.bacaDiPerangkat = async function (type, file, onStatus) {
    if (typeof WebAssembly !== "object") throw new Error("wasm");
    // CSP tanpa 'wasm-unsafe-eval' menolak modul WebAssembly terkecil ini, jadi admin langsung mendapat pesan yang tepat
    try { await WebAssembly.instantiate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0])); } catch (e) { throw new Error("wasm"); }
    ocrProgres = (m) => {
      const tahap = PESAN_TAHAP[m.status];
      if (tahap) onStatus(m.status === "recognizing text" ? `${tahap}... ${Math.round((m.progress || 0) * 100)}%` : `${tahap}...`);
    };
    try {
      onStatus("Memuat pembaca teks. Scan pertama butuh beberapa detik, berikutnya lebih cepat.");
      const w = await pekerjaOcr(type);
      if (type === "paspor") {
        // Area MRZ dulu (30% bawah); bila dua barisnya tidak ditemukan, baca seluruh halaman
        const bawah = await bacaTeks(type, w, await siapkanGambar(file, { bawah: 0.3 }));
        let res = await KU.erp.ocrMrz(bawah);
        if (res.success && !Object.keys(res.data?.fields || {}).length) {
          const semua = await bacaTeks(type, w, await siapkanGambar(file));
          res = await KU.erp.ocrMrz(bawah + "\n" + semua);
        }
        return res;
      }
      const teks = await bacaTeks(type, w, await siapkanGambar(file));
      return await KU.erp.ocrKtpTeks(teks);
    } finally { ocrProgres = null; }
  };

  // Pesan galat baca di perangkat untuk admin (bukan pesan teknis)
  window.pesanGagalBaca = function (e) {
    const m = String(e?.message || e || "");
    if (m === "wasm" || /WebAssembly|wasm|Content Security Policy|unsafe-eval/i.test(m)) {
      return "Pembaca teks tidak bisa berjalan di browser ini (WebAssembly diblokir). Isi data secara manual, atau isi API key Gemini di Pengaturan untuk memakai mode akurat.";
    }
    if (m === "muat" || m === "batas-muat" || /fetch|network|Failed to load|NetworkError/i.test(m)) {
      return "Pembaca teks gagal dimuat. Periksa koneksi internet, lalu coba lagi.";
    }
    if (m === "batas-baca") {
      return "Membaca foto terlalu lama. Coba foto yang lebih kecil dan lurus, atau isi data secara manual.";
    }
    return "Foto tidak bisa dibaca. Coba foto yang lebih terang dan lurus, atau isi data secara manual.";
  };
  // ---------- KOMISI AGEN: tabel komisi tier per entitas (keputusan PO 26 Okt 2026, DESAIN_STRUKTUR_AGEN_KOMISI.md v2) ----------
  // Baris = tier (urutan baris = urutan tier), kolom = komisi bawaan + penimpa per jenis paket. Server memeriksa ulang
  // semua aturan: hak ubah, 1-5 tier aktif, batas komisi cabang, dan tier yang masih dipakai agen.
  let tierView = null;

  window.loadKomisiTierView = async function (entitas) {
    const me = window.__erpMe || {};
    const sel = document.getElementById("kt-entitas");
    const tbody = document.getElementById("kt-tbody");
    if (!tbody) return;
    // Pilihan entitas hanya untuk sesi Pusat; sesi cabang selalu memakai cabangnya sendiri
    const pusat = me.role === "OWNER" || me.entitas === "PST-01";
    if (sel && !sel.dataset.terisi) {
      const en = pusat ? await KU.erp.listEntitas().catch(() => null) : null;
      const items = en?.success ? (en.data?.items || []).filter((e) => e.status_aktif === "Aktif") : [];
      sel.innerHTML = items.length
        ? items.map((e) => `<option value="${esc(e.id)}">${esc(e.nama_entitas)}</option>`).join("")
        : `<option value="${esc(me.entitas || "PST-01")}">${esc(me.entitas || "PST-01")}</option>`;
      sel.classList.toggle("hidden", items.length < 2);
      sel.dataset.terisi = "1";
    }
    entitas = entitas || sel?.value || me.entitas || "PST-01";
    if (sel) sel.value = entitas;
    tbody.innerHTML = `<tr><td class="py-8 text-center text-[12px] text-inksoft/60">Memuat...</td></tr>`;
    document.getElementById("kt-peringatan").classList.add("hidden");
    try {
      const res = await KU.erp.komisiTier(entitas);
      if (!res.success) throw new Error(res.message);
      tierView = { ...res.data, tiers: res.data.tiers.map((t) => ({ ...t, penimpa: { ...t.penimpa } })) };
      renderKomisiTier();
    } catch (e) {
      tbody.innerHTML = `<tr><td class="py-8 text-center text-[12px] text-inksoft/60">Gagal memuat: ${esc(e.message)}</td></tr>`;
    }
  };

  function renderKomisiTier() {
    const v = tierView;
    const ubah = !!v.boleh_ubah;
    const cabang = v.entitas.tipe === "CABANG";
    const batasPer = v.entitas.batas_per_jenis || {};
    const batas = (jenis) => batasPer[jenis] ?? v.entitas.batas_bawaan;

    const batasEl = document.getElementById("kt-batas");
    batasEl.classList.toggle("hidden", !cabang);
    if (cabang) {
      const khusus = Object.entries(batasPer);
      batasEl.innerHTML = `<i class="ph-light ph-buildings text-xs"></i> Batas komisi ${esc(v.entitas.nama)} dari Owner: <b class="font-mono">${rp(v.entitas.batas_bawaan)}</b>`
        + (khusus.length ? `, kecuali ${khusus.map(([j, n]) => `${esc(j)} <b class="font-mono">${rp(n)}</b>`).join(", ")}` : "")
        + ". Komisi tier cabang tidak boleh melebihi batas ini.";
    }
    const baca = document.getElementById("kt-baca");
    baca.classList.toggle("hidden", ubah);
    baca.querySelector("span").textContent = cabang
      ? "Tabel komisi cabang diatur Kepala Cabang dan Owner. Anda bisa melihat tabelnya."
      : "Tabel komisi pusat diatur Owner. Anda bisa melihat tabelnya.";
    document.getElementById("kt-aksi").classList.toggle("hidden", !ubah);
    document.getElementById("kt-tambah").disabled = v.tiers.filter((t) => t.aktif).length >= v.maks_tier;

    const jenis = v.jenis_paket || [];
    const subJudul = (j) => cabang
      ? `batas ${rp(batas(j.jenis_paket))}`
      : (j.margin_terkecil !== null && j.margin_terkecil !== undefined ? `margin ${rp(j.margin_terkecil)}` : "");
    document.getElementById("kt-thead").innerHTML = `<tr><th>Tier</th><th class="text-right">Komisi bawaan</th>${jenis.map((j) =>
      `<th class="whitespace-nowrap text-right">${esc(j.jenis_paket)}${subJudul(j) ? `<span class="block text-[10px] font-normal normal-case tracking-normal text-inksoft/60">${subJudul(j)}</span>` : ""}</th>`).join("")}</tr>`;

    const dis = ubah ? "" : "disabled";
    document.getElementById("kt-tbody").innerHTML = v.tiers.map((t, i) => `
      <tr class="${t.aktif ? "" : "opacity-60"}" data-i="${i}">
        <td class="align-top"><div class="flex items-start gap-2">
          ${ubah ? `<div class="flex flex-col">
            <button type="button" class="text-inksoft/50 hover:text-ink disabled:opacity-30" aria-label="Naikkan ${esc(t.nama)}" onclick="geserTier(${i}, -1)" ${i === 0 ? "disabled" : ""}><i class="ph-light ph-caret-up text-xs"></i></button>
            <button type="button" class="text-inksoft/50 hover:text-ink disabled:opacity-30" aria-label="Turunkan ${esc(t.nama)}" onclick="geserTier(${i}, 1)" ${i === v.tiers.length - 1 ? "disabled" : ""}><i class="ph-light ph-caret-down text-xs"></i></button>
          </div>` : ""}
          <div>
            <input class="f-input !w-36 font-semibold" data-f="nama" maxlength="50" aria-label="Nama tier ${i + 1}" value="${esc(t.nama)}" ${dis} />
            <div class="mt-1.5 flex items-center gap-3 text-[11px] text-inksoft">
              <span>${t.jumlah_agen || 0} agen aktif</span>
              ${ubah ? `<label class="inline-flex items-center gap-1.5"><input type="checkbox" data-f="aktif" ${t.aktif ? "checked" : ""} /> Aktif</label>
              <button type="button" class="text-inksoft/60 hover:text-danger disabled:opacity-30 disabled:hover:text-inksoft/60" title="${t.jumlah_agen > 0 ? "Masih dipakai agen aktif" : "Hapus tier"}" aria-label="Hapus ${esc(t.nama)}" onclick="hapusTier(${i})" ${t.jumlah_agen > 0 ? "disabled" : ""}><i class="ph-light ph-trash text-sm"></i></button>` : (t.aktif ? "" : "<span>Nonaktif</span>")}
            </div>
          </div>
        </div></td>
        <td class="text-right align-top"><input class="f-input !w-32 text-right font-mono" data-f="bawaan" inputmode="numeric" aria-label="Komisi bawaan ${esc(t.nama)}" value="${t.nominal_bawaan === null ? "" : fmtRibuan(t.nominal_bawaan)}" placeholder="Belum diatur" oninput="ubahBawaanTier(this)" ${dis} /></td>
        ${jenis.map((j) => `<td class="text-right align-top"><input class="f-input !w-28 text-right font-mono" data-jenis="${esc(j.jenis_paket)}" inputmode="numeric" aria-label="Komisi ${esc(t.nama)} paket ${esc(j.jenis_paket)}" value="${t.penimpa[j.jenis_paket] === undefined ? "" : fmtRibuan(t.penimpa[j.jenis_paket])}" placeholder="${t.nominal_bawaan === null ? "" : fmtRibuan(t.nominal_bawaan)}" oninput="this.value=fmtRibuan(this.value)" ${dis} /></td>`).join("")}
      </tr>`).join("") || `<tr><td colspan="${jenis.length + 2}" class="py-8 text-center text-[12px] text-inksoft/60">Belum ada tier.</td></tr>`;
  }

  // Penimpa kosong memakai komisi bawaan: placeholder kolom jenis paket ikut angka bawaan yang sedang diketik
  window.ubahBawaanTier = function (el) {
    el.value = fmtRibuan(el.value);
    el.closest("tr").querySelectorAll("[data-jenis]").forEach((x) => { x.placeholder = el.value; });
  };

  function bacaTabelTier() {
    $$("#kt-tbody tr[data-i]").forEach((tr) => {
      const t = tierView.tiers[Number(tr.dataset.i)];
      t.nama = tr.querySelector('[data-f="nama"]').value.trim();
      const b = angkaRupiah(tr.querySelector('[data-f="bawaan"]').value);
      t.nominal_bawaan = b === "" ? null : Number(b);
      const aktif = tr.querySelector('[data-f="aktif"]');
      if (aktif) t.aktif = aktif.checked;
      tr.querySelectorAll("[data-jenis]").forEach((el) => {
        const n = angkaRupiah(el.value);
        if (n === "") delete t.penimpa[el.dataset.jenis];
        else t.penimpa[el.dataset.jenis] = Number(n);
      });
    });
  }

  window.tambahTier = function () {
    bacaTabelTier();
    let k = tierView.tiers.length + 1;
    while (tierView.tiers.some((t) => t.nama.toLowerCase() === `tier ${k}`)) k++;
    tierView.tiers.push({ id: null, nama: `Tier ${k}`, nominal_bawaan: null, aktif: true, jumlah_agen: 0, penimpa: {} });
    renderKomisiTier();
  };

  window.geserTier = function (i, arah) {
    bacaTabelTier();
    const t = tierView.tiers;
    const j = i + arah;
    if (j < 0 || j >= t.length) return;
    [t[i], t[j]] = [t[j], t[i]];
    renderKomisiTier();
  };

  window.hapusTier = function (i) {
    bacaTabelTier();
    const t = tierView.tiers[i];
    if (t.id && !confirm(`Hapus ${t.nama}? Tier dihapus saat tabel disimpan.`)) return;
    tierView.tiers.splice(i, 1);
    renderKomisiTier();
  };

  window.simpanKomisiTier = async function () {
    bacaTabelTier();
    if (tierView.tiers.some((t) => !t.nama)) return alert("Nama tier wajib diisi.");
    const tiers = tierView.tiers.map((t) => ({
      id: t.id, nama: t.nama, nominal_bawaan: t.nominal_bawaan === null ? "" : t.nominal_bawaan, aktif: t.aktif, penimpa: t.penimpa,
    }));
    const btn = document.getElementById("kt-simpan");
    btn.disabled = true;
    try {
      const res = await KU.erp.simpanKomisiTier(tierView.entitas.id, tiers);
      if (!res.success) return alert(res.message || "Gagal menyimpan.");
      tierView.tiers = res.data.tiers.map((t) => ({ ...t, penimpa: { ...t.penimpa } }));
      renderKomisiTier();
      const p = document.getElementById("kt-peringatan");
      const peringatan = res.data.peringatan || [];
      p.innerHTML = `<p class="font-semibold">${esc(res.message || "Komisi tier disimpan.")}</p>`
        + (peringatan.length ? `<ul class="mt-1.5 list-disc space-y-0.5 pl-4">${peringatan.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "");
      p.classList.toggle("text-warn", peringatan.length > 0);
      p.classList.toggle("text-ku-700", !peringatan.length);
      p.classList.remove("hidden");
    } catch (e) { alert("Error: " + e.message); } finally { btn.disabled = false; }
  };

  // ---------- Kata sandi sementara, persiapan travel, Akun saya (27 Okt 2026, DESAIN_AKUN_OWNER_ONBOARDING.md) ----------
  // Server: POST /api/auth/ganti-password, GET/POST /api/onboarding. Selama kata sandi sementara belum diganti, semua API
  // lain ditolak 403 WAJIB_GANTI_PASSWORD (JwtMiddleware), jadi layar #mulai-sandi satu-satunya yang bisa dipakai.
  // Status tiap langkah dihitung server dari data Pengaturan/Pengguna; yang disimpan hanya langkah dilewati & tur fitur.
  const MULAI = { data: null, aktif: null, set: null, logo: "" };
  const MULAI_LANGKAH = {
    password: { judul: "Kata sandi", ikon: "ph-key" },
    profil: { judul: "Profil travel", ikon: "ph-buildings" },
    rekening: { judul: "Rekening resmi", ikon: "ph-bank" },
    wa: { judul: "WhatsApp", ikon: "ph-whatsapp-logo" },
    tim: { judul: "Tim kantor", ikon: "ph-users-three" },
    fitur: { judul: "Kenalan fitur", ikon: "ph-compass" },
  };
  const MULAI_FITUR = [
    { view: "katalog", ikon: "ph-tag", judul: "Katalog Harga & Jadwal", teks: "Susun paket, harga, dan kursi per keberangkatan." },
    { view: "jamaah", ikon: "ph-identification-card", judul: "Data Jamaah", teks: "Daftarkan jamaah, scan KTP atau paspor, dan pantau kelengkapan berkas." },
    { view: "keuangan", ikon: "ph-money", judul: "Laporan Keuangan", teks: "Catat pembayaran dan cicilan jamaah, lalu cetak kuitansinya." },
    { view: "agency", ikon: "ph-handshake", judul: "Jaringan Agen", teks: "Kelola agen per tier beserta komisi tiap pendaftaran." },
    { view: null, ikon: "ph-device-mobile", judul: "Portal Agen & Jamaah", teks: "Agen dan jamaah masuk lewat alamat masing-masing:" },
    { view: "performa", ikon: "ph-chart-line-up", judul: "Laporan Performa", teks: "Pantau pendaftaran per cabang dan per agen." },
  ];

  // Syarat kata sandi = PasswordPolicy::periksa di server (minimal 10, 5 karakter berbeda, tanpa username)
  function syaratSandi(baru, ulang) {
    const u = String((window.__erpMe || {}).username || "").toLowerCase();
    return [
      [baru.length >= 10, "Minimal 10 karakter"],
      [new Set([...baru]).size >= 5, "Minimal 5 karakter yang berbeda"],
      [!(u.length >= 3 && baru.toLowerCase().includes(u)), "Tidak memuat username"],
      [baru !== "" && baru === ulang, "Sama dengan isian ulangan"],
    ];
  }
  function renderSyarat(el, daftar) {
    if (!el) return;
    el.innerHTML = daftar.map(([ok, t]) => `<li class="flex items-center gap-1.5 ${ok ? "text-ku-700" : ""}"><i class="ph-light ${ok ? "ph-check-circle" : "ph-circle"} text-xs" aria-hidden="true"></i>${esc(t)}<span class="sr-only">${ok ? " (terpenuhi)" : " (belum)"}</span></li>`).join("");
  }
  const nilai = (id) => document.getElementById(id)?.value ?? ""; // kata sandi: tanpa trim

  function mulaiTampil(panel) {
    $("#mulai").classList.remove("hidden");
    $("#mulai-sandi").classList.toggle("hidden", panel !== "sandi");
    $("#mulai-langkah").classList.toggle("hidden", panel !== "langkah");
    document.body.style.overflow = "hidden";
  }
  function mulaiSembunyi() {
    $("#mulai").classList.add("hidden");
    document.body.style.overflow = "";
  }

  // ---- Panel 1: kata sandi sementara wajib diganti ----
  window.mulaiWajibSandi = function () {
    setVal("mulai-username", (window.__erpMe || {}).username || "");
    mulaiTampil("sandi");
    window.mulaiCekSyarat();
    setTimeout(() => $("#mulai-lama")?.focus(), 50);
  };
  window.addEventListener("ku:wajib-ganti-password", () => window.mulaiWajibSandi());
  window.mulaiCekSyarat = () => renderSyarat($("#mulai-syarat"), syaratSandi(nilai("mulai-baru"), nilai("mulai-ulang")));

  window.mulaiSimpanSandi = async function () {
    const msg = $("#mulai-sandi-msg");
    msg.textContent = "";
    const lama = nilai("mulai-lama");
    const kurang = syaratSandi(nilai("mulai-baru"), nilai("mulai-ulang")).find(([ok]) => !ok);
    if (!lama) { msg.textContent = "Isi kata sandi sementara yang Anda terima."; return; }
    if (kurang) { msg.textContent = "Kata sandi baru belum memenuhi syarat: " + kurang[1].toLowerCase() + "."; return; }
    const btn = $("#mulai-sandi-btn");
    btn.disabled = true;
    try {
      const res = await KU.erp.gantiPassword(lama, nilai("mulai-baru"));
      if (!res.success) { msg.textContent = res.message || "Kata sandi belum tersimpan. Coba lagi."; return; }
      // Sesi baru tanpa batasan: muat ulang supaya dashboard termuat penuh, lalu panduan persiapan dibuka otomatis
      try { sessionStorage.setItem("ku_mulai_buka", "1"); } catch (e) { /* tanpa sessionStorage: panduan dibuka dari kartu Dashboard */ }
      window.location.reload();
    } catch (e) {
      msg.textContent = "Gagal terhubung ke server. Periksa koneksi lalu coba lagi.";
    } finally {
      btn.disabled = false;
    }
  };

  // ---- Panel 2: persiapan travel ----
  window.loadMulai = async function () {
    if ((window.__erpMe || {}).impersonation) return;
    let res;
    try { res = await KU.erp.onboarding(); } catch (e) { return; }
    if (!res || !res.success || !res.data) return;
    MULAI.data = res.data;
    renderMulaiKartu();
    renderAkunPersiapan();
    let buka = false;
    try {
      buka = sessionStorage.getItem("ku_mulai_buka") === "1";
      sessionStorage.removeItem("ku_mulai_buka");
    } catch (e) { /* abaikan */ }
    if (buka && !MULAI.data.semua_beres) window.mulaiBuka();
  };

  function langkahBerikut() {
    const d = MULAI.data;
    return d.langkah.find((l) => !l.selesai && !l.dilewati) || null;
  }

  function renderMulaiKartu() {
    const kartu = $("#mulai-kartu");
    const d = MULAI.data;
    if (!kartu || !d) return;
    const tampil = d.jumlah > 0 && !d.semua_beres && !d.ditutup;
    kartu.classList.toggle("hidden", !tampil);
    kartu.classList.toggle("flex", tampil);
    if (!tampil) return;
    const next = langkahBerikut();
    kartu.querySelector("[data-mulai-kartu-teks]").textContent = `${d.beres} dari ${d.jumlah} langkah beres.`
      + (next ? ` Berikutnya: ${MULAI_LANGKAH[next.kunci]?.judul || next.kunci}.` : "");
    kartu.querySelector("[data-mulai-kartu-bar]").style.width = Math.round((d.beres / Math.max(1, d.jumlah)) * 100) + "%";
  }

  function renderAkunPersiapan() {
    const box = $("#akun-persiapan");
    const d = MULAI.data;
    if (!box || !d) return;
    box.classList.toggle("hidden", !(d.jumlah > 0));
    $("#akun-persiapan-teks").textContent = d.semua_beres ? "Semua langkah sudah beres." : `${d.beres} dari ${d.jumlah} langkah beres.`;
  }

  window.mulaiBuka = async function (kunci) {
    if (!MULAI.data) return;
    // Nilai Pengaturan untuk mengisi awal form profil/rekening/WhatsApp (hanya Owner yang punya izin)
    if (MULAI.data.peran === "OWNER" && !MULAI.set) {
      try {
        const r = await KU.erp.getSettings();
        if (r.success) {
          const s = r.data || {};
          MULAI.set = (k) => {
            const v = Array.isArray(s) ? s.find((x) => x.key === k)?.value : s[k];
            return v !== null && typeof v === "object" ? (v.value ?? "") : (v ?? "");
          };
        }
      } catch (e) { /* form tetap bisa diisi dari kosong */ }
    }
    const next = langkahBerikut();
    MULAI.aktif = kunci || (next ? next.kunci : "selesai");
    mulaiTampil("langkah");
    renderMulai();
  };
  window.mulaiPilih = (kunci) => { MULAI.aktif = kunci; renderMulai(); };
  window.mulaiTutup = function () {
    mulaiSembunyi();
    renderMulaiKartu();
  };
  window.mulaiTutupKartu = async function () {
    try {
      const r = await KU.erp.onboardingAksi("tutup");
      if (r.success) { MULAI.data = r.data; renderMulaiKartu(); }
    } catch (e) { /* abaikan */ }
  };

  function renderMulai() {
    const d = MULAI.data;
    $("#mulai-langkah-sub").textContent = d.peran === "OWNER"
      ? "Lengkapi supaya kuitansi, brosur, dan Portal Jamaah memakai data travel Anda. Setiap langkah bisa dilewati dan dilanjutkan kapan saja dari Dashboard."
      : "Kenali menu yang akan Anda pakai sehari-hari.";
    $("#mulai-hitung").textContent = `${d.beres} dari ${d.jumlah} beres`;
    $("#mulai-bar").style.width = Math.round((d.beres / Math.max(1, d.jumlah)) * 100) + "%";
    $("#mulai-daftar").innerHTML = d.langkah.map((l, i) => {
      const info = MULAI_LANGKAH[l.kunci] || { judul: l.kunci, ikon: "ph-circle" };
      const aktif = l.kunci === MULAI.aktif;
      const tanda = l.selesai
        ? `<i class="ph-light ph-check-circle text-base text-ku-600" aria-hidden="true"></i>`
        : l.dilewati
          ? `<i class="ph-light ph-skip-forward text-base text-inksoft/60" aria-hidden="true"></i>`
          : `<span class="flex h-5 w-5 items-center justify-center rounded-full border text-[10px] font-bold ${aktif ? "border-cream/40 text-cream" : "border-hairline text-inksoft"}">${i + 1}</span>`;
      const status = l.selesai ? "selesai" : l.dilewati ? "dilewati" : "belum";
      const kunci = l.kunci === "password";
      return `<li class="shrink-0"><button type="button" ${kunci ? "disabled" : `onclick="mulaiPilih(${jsArg(l.kunci)})"`}
        class="flex w-full items-center gap-2.5 whitespace-nowrap rounded-xl px-3 py-2 text-left text-[12.5px] transition-colors ${aktif ? "bg-ku-950 font-semibold text-cream" : "text-ink hover:bg-ku-950/5"} ${kunci ? "cursor-default opacity-70" : ""}"
        ${aktif ? 'aria-current="step"' : ""}>${tanda}<span>${esc(info.judul)}<span class="sr-only"> (${status})</span></span></button></li>`;
    }).join("");
    $("#mulai-isi").innerHTML = isiLangkah(MULAI.aktif);
    setTimeout(() => $("#mulai-isi input:not([type=file]), #mulai-isi textarea")?.focus(), 30);
  }

  const kakiLangkah = (kunci, label) => `
    <p class="mt-3 text-[12px] font-semibold text-danger" role="alert" data-mulai-msg></p>
    <div class="mt-5 flex flex-wrap items-center justify-between gap-3">
      <button type="button" onclick="mulaiLewati(${jsArg(kunci)})" class="text-[12px] font-semibold text-inksoft hover:text-ink">Lewati dulu</button>
      <button type="submit" class="btn-primary" data-mulai-simpan>${esc(label)}<span class="flex h-6 w-6 items-center justify-center rounded-full bg-cream/15"><i class="ph-light ph-arrow-right text-[10px]" aria-hidden="true"></i></span></button>
    </div>`;
  const judulLangkah = (kunci, teks) => {
    const l = (MULAI.data.langkah || []).find((x) => x.kunci === kunci);
    return `<h3 class="font-display text-xl font-medium text-ink">${esc(MULAI_LANGKAH[kunci].judul)}</h3>
      <p class="mt-1 text-[12.5px] leading-relaxed text-inksoft">${esc(teks)}</p>
      ${l && l.selesai ? `<p class="mt-2 inline-flex items-center gap-1.5 rounded-full bg-ku-50 px-3 py-1 text-[11px] font-semibold text-ku-700"><i class="ph-light ph-check-circle text-xs" aria-hidden="true"></i>Sudah terisi. Ubah di sini atau nanti di menu Pengaturan.</p>` : ""}`;
  };
  const isian = (id, label, kelas, attrs, nilaiAwal = "") => `<div><label class="f-label" for="${id}">${esc(label)}</label><input id="${id}" class="f-input ${kelas}" value="${esc(nilaiAwal)}" ${attrs} /></div>`;
  const ambil = (k) => (MULAI.set ? MULAI.set(k) : "");

  function isiLangkah(kunci) {
    switch (kunci) {
      case "profil":
        return `${judulLangkah("profil", "Dipakai di kuitansi, brosur, Portal Jamaah, dan Portal Agen.")}
          <form class="mt-5 space-y-3.5" onsubmit="mulaiSimpanProfil(); return false;">
            ${isian("mp-nama", "Nama travel", "uppercase", 'required minlength="3" autocomplete="organization"', ambil("NAMA_TRAVEL"))}
            <div><label class="f-label" for="mp-alamat">Alamat kantor</label><textarea id="mp-alamat" class="f-input" rows="2" required>${esc(ambil("ALAMAT_TRAVEL"))}</textarea></div>
            ${isian("mp-izin", "Nomor izin PPIU", "uppercase", "required", ambil("IZIN_PPIU"))}
            <div><label class="f-label" for="mp-logo">Logo <span class="font-normal normal-case text-inksoft/70">(opsional, maks. 2 MB)</span></label>
              <input id="mp-logo" type="file" accept="image/png,image/jpeg,image/webp" class="block w-full text-[12px] text-inksoft file:mr-3 file:rounded-full file:border-0 file:bg-ku-950 file:px-4 file:py-2 file:text-[11px] file:font-semibold file:text-cream" onchange="mulaiUnggahLogo(this)" />
              <p id="mp-logo-info" class="mt-1 text-[11px] text-inksoft" aria-live="polite">${ambil("LOGO_URL") ? "Logo sudah ada. Pilih berkas baru bila ingin mengganti." : ""}</p></div>
            ${kakiLangkah("profil", "Simpan & lanjut")}
          </form>`;
      case "rekening":
        return `${judulLangkah("rekening", "Tampil di Portal Jamaah sebagai tujuan transfer resmi, supaya jamaah tidak mentransfer ke rekening lain.")}
          <form class="mt-5 space-y-3.5" onsubmit="mulaiSimpanRekening(); return false;">
            ${isian("mr-bank", "Nama bank", "uppercase", 'required placeholder="mis. BSI"', ambil("REKENING_BANK"))}
            ${isian("mr-nomor", "Nomor rekening", "font-mono", 'required inputmode="numeric"', ambil("REKENING_NOMOR"))}
            ${isian("mr-nama", "Atas nama", "uppercase", "required", ambil("REKENING_NAMA"))}
            ${kakiLangkah("rekening", "Simpan & lanjut")}
          </form>`;
      case "wa": {
        const adaToken = !!ambil("FONNTE_TOKEN");
        return `${judulLangkah("wa", "Pengingat cicilan dan notifikasi dikirim dari nomor WhatsApp travel lewat Fonnte. Token ada di dashboard fonnte.com setelah nomor travel terhubung.")}
          <form class="mt-5 space-y-3.5" onsubmit="mulaiSimpanWa(); return false;">
            ${isian("mw-token", "Token Fonnte", "font-mono", `type="password" autocomplete="off" ${adaToken ? 'placeholder="Sudah tersimpan. Kosongkan bila tidak diganti."' : "required"}`)}
            ${isian("mw-hp", "Nomor WhatsApp admin (penerima notifikasi)", "font-mono", 'required inputmode="numeric" placeholder="mis. 6281234567890"', ambil("ADMIN_PHONE"))}
            <p class="text-[11.5px] text-inksoft">Setelah disimpan, satu pesan uji dikirim ke nomor admin.</p>
            ${kakiLangkah("wa", "Simpan & kirim pesan uji")}
          </form>`;
      }
      case "tim":
        return `${judulLangkah("tim", "Tambahkan staf keuangan, staf operasional, atau kepala cabang. Kata sandi yang Anda buat untuk mereka bersifat sementara: mereka wajib menggantinya saat masuk pertama.")}
          <div class="mt-5 rounded-2xl border border-hairline bg-white/70 p-4 text-[12.5px] text-inksoft">Setelah menambah staf, lanjutkan persiapan dari kartu di Dashboard.</div>
          <p class="mt-3 text-[12px] font-semibold text-danger" role="alert" data-mulai-msg></p>
          <div class="mt-5 flex flex-wrap items-center justify-between gap-3">
            <button type="button" onclick="mulaiLewati('tim')" class="text-[12px] font-semibold text-inksoft hover:text-ink">Lewati dulu</button>
            <button type="button" onclick="mulaiTambahStaf()" class="btn-primary">Tambah staf<span class="flex h-6 w-6 items-center justify-center rounded-full bg-cream/15"><i class="ph-light ph-arrow-right text-[10px]" aria-hidden="true"></i></span></button>
          </div>`;
      case "fitur": {
        const terlihat = (v) => !v || !document.querySelector(`.nav-link[data-view="${v}"]`)?.classList.contains("hidden");
        const host = location.host;
        return `${judulLangkah("fitur", "Menu yang paling sering dipakai. Tekan Buka untuk melihatnya; panduan ini bisa dibuka lagi dari menu Akun saya.")}
          <div class="mt-5 grid gap-3 sm:grid-cols-2">${MULAI_FITUR.filter((f) => terlihat(f.view)).map((f) => `
            <div class="flex flex-col rounded-2xl border border-hairline bg-white/70 p-4">
              <p class="flex items-center gap-2 text-[13px] font-semibold text-ink"><i class="ph-light ${f.ikon} text-base text-ku-700" aria-hidden="true"></i>${esc(f.judul)}</p>
              <p class="mt-1 flex-1 text-[12px] leading-relaxed text-inksoft">${esc(f.teks)}</p>
              ${f.view
                ? `<button type="button" onclick="mulaiBukaMenu(${jsArg(f.view)})" class="mt-3 self-start text-[12px] font-bold text-ku-700 hover:underline">Buka</button>`
                : `<p class="mt-2 break-all font-mono text-[11px] text-ink">https://${esc(host)}/agent/<br>https://${esc(host)}/jamaah/</p>`}
            </div>`).join("")}</div>
          <p class="mt-3 text-[12px] font-semibold text-danger" role="alert" data-mulai-msg></p>
          <div class="mt-5 flex justify-end"><button type="button" onclick="mulaiFiturSelesai()" class="btn-primary">Selesai<span class="flex h-6 w-6 items-center justify-center rounded-full bg-cream/15"><i class="ph-light ph-check text-[10px]" aria-hidden="true"></i></span></button></div>`;
      }
      default:
        return `<div class="py-6 text-center">
            <span class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-ku-50 text-ku-700"><i class="ph-light ph-flag-checkered text-2xl" aria-hidden="true"></i></span>
            <h3 class="mt-4 font-display text-xl font-medium text-ink">Persiapan beres</h3>
            <p class="mx-auto mt-1 max-w-sm text-[12.5px] leading-relaxed text-inksoft">Langkah yang dilewati bisa diisi kapan saja dari menu Pengaturan atau dari Akun saya.</p>
            <button type="button" onclick="mulaiTutup()" class="btn-primary mx-auto mt-5">Mulai memakai aplikasi<span class="flex h-6 w-6 items-center justify-center rounded-full bg-cream/15"><i class="ph-light ph-arrow-right text-[10px]" aria-hidden="true"></i></span></button>
          </div>`;
    }
  }

  const pesanLangkah = (t) => { const el = $("#mulai-isi [data-mulai-msg]"); if (el) el.textContent = t || ""; };
  async function muatUlangLangkah(maju) {
    try {
      const r = await KU.erp.onboarding();
      if (r.success) MULAI.data = r.data;
    } catch (e) { /* tetap pakai data lama */ }
    renderMulaiKartu();
    renderAkunPersiapan();
    if (maju) {
      const next = langkahBerikut();
      MULAI.aktif = next ? next.kunci : "selesai";
    }
    renderMulai();
  }
  async function simpanPengaturan(data, tombolTeks) {
    const btn = $("#mulai-isi [data-mulai-simpan]");
    if (btn) btn.disabled = true;
    try {
      const res = await KU.erp.updateSettings(data);
      if (!res.success) { pesanLangkah(res.message || `${tombolTeks} belum tersimpan.`); return false; }
      if (MULAI.set) { const lama = MULAI.set; MULAI.set = (k) => (k in data ? data[k] : lama(k)); }
      return true;
    } catch (e) {
      pesanLangkah("Gagal terhubung ke server. Coba lagi.");
      return false;
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  window.mulaiUnggahLogo = async function (el) {
    const file = el.files?.[0];
    const info = $("#mp-logo-info");
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { info.textContent = "Ukuran logo maksimal 2 MB."; el.value = ""; return; }
    info.textContent = "Mengunggah logo...";
    try {
      const res = await KU.erp.uploadLogo(file);
      MULAI.logo = res.success ? res.data.url : "";
      info.textContent = res.success ? "Logo terunggah. Tersimpan saat Anda menekan Simpan." : (res.message || "Logo gagal diunggah.");
    } catch (e) { info.textContent = "Logo gagal diunggah. Periksa koneksi."; }
  };
  window.mulaiSimpanProfil = async function () {
    const data = { NAMA_TRAVEL: val("mp-nama").toUpperCase(), ALAMAT_TRAVEL: val("mp-alamat"), IZIN_PPIU: val("mp-izin").toUpperCase() };
    if (MULAI.logo) data.LOGO_URL = MULAI.logo;
    if (data.NAMA_TRAVEL.length < 3) return pesanLangkah("Nama travel minimal 3 karakter.");
    if (!data.ALAMAT_TRAVEL || !data.IZIN_PPIU) return pesanLangkah("Alamat kantor dan nomor izin PPIU wajib diisi.");
    if (await simpanPengaturan(data, "Profil")) {
      if (data.NAMA_TRAVEL) $$(".tenant-name, [data-branding='nama']").forEach((e2) => { e2.textContent = data.NAMA_TRAVEL; });
      muatUlangLangkah(true);
    }
  };
  window.mulaiSimpanRekening = async function () {
    // Validasi & konfirmasi sama dengan Pengaturan > Rekening resmi (IntegrasiController::updateSettings)
    const data = { REKENING_BANK: val("mr-bank").toUpperCase(), REKENING_NOMOR: val("mr-nomor").replace(/\D/g, ""), REKENING_NAMA: val("mr-nama").toUpperCase() };
    if (!data.REKENING_BANK) return pesanLangkah("Nama bank wajib diisi.");
    if (!/^\d{6,20}$/.test(data.REKENING_NOMOR)) return pesanLangkah("Nomor rekening harus 6 sampai 20 digit.");
    if (data.REKENING_NAMA.length < 3) return pesanLangkah("Nama pemilik rekening minimal 3 karakter.");
    if (!confirm(`Simpan rekening resmi berikut? Jamaah akan mentransfer ke rekening ini.\n\n${data.REKENING_BANK} - ${data.REKENING_NOMOR}\na.n. ${data.REKENING_NAMA}`)) return;
    if (await simpanPengaturan(data, "Rekening")) muatUlangLangkah(true);
  };
  window.mulaiSimpanWa = async function () {
    const token = nilai("mw-token").trim();
    const hp = val("mw-hp").replace(/\D/g, "");
    if (!/^\d{8,15}$/.test(hp)) return pesanLangkah("Nomor WhatsApp admin harus 8 sampai 15 digit, diawali 62.");
    if (!token && !ambil("FONNTE_TOKEN")) return pesanLangkah("Isi token Fonnte.");
    const data = { ADMIN_PHONE: hp };
    if (token) data.FONNTE_TOKEN = token;
    if (!(await simpanPengaturan(data, "Pengaturan WhatsApp"))) return;
    let hasil = "";
    try {
      const t = await KU.erp.testFonnte();
      hasil = t.success ? "" : (t.message || "Pesan uji belum terkirim.");
    } catch (e) { hasil = "Pesan uji belum terkirim."; }
    if (hasil) {
      // Tersimpan, tetapi pesan uji gagal: tetap di langkah ini supaya token/nomor bisa diperiksa
      await muatUlangLangkah(false);
      pesanLangkah("Tersimpan, tetapi " + hasil.charAt(0).toLowerCase() + hasil.slice(1));
      return;
    }
    muatUlangLangkah(true);
  };
  window.mulaiLewati = async function (kunci) {
    try {
      const r = await KU.erp.onboardingAksi("lewati", kunci);
      if (!r.success) return pesanLangkah(r.message || "Langkah belum bisa dilewati.");
      MULAI.data = r.data;
      muatUlangLangkah(true);
    } catch (e) { pesanLangkah("Gagal terhubung ke server. Coba lagi."); }
  };
  window.mulaiFiturSelesai = async function () {
    try {
      const r = await KU.erp.onboardingAksi("fitur_selesai");
      if (!r.success) return pesanLangkah(r.message || "Belum tersimpan.");
      MULAI.data = r.data;
      muatUlangLangkah(true);
    } catch (e) { pesanLangkah("Gagal terhubung ke server. Coba lagi."); }
  };
  window.mulaiTambahStaf = function () {
    mulaiSembunyi();
    showView("users");
    window.openUserForm?.();
  };
  window.mulaiBukaMenu = function (view) {
    mulaiSembunyi();
    showView(view);
  };

  // ---- Akun saya & Avatar Foto Profil (Referensi DNZY SAKINAH) ----
  window.renderUserAvatar = function (photoUrl) {
    const me = window.__erpMe || {};
    const nama = me.nama || "Ummu Aisyah";
    const initial = (nama || "U").trim().charAt(0).toUpperCase() || "U";
    let photo = photoUrl;
    if (!photo) {
      try { photo = localStorage.getItem("dnzy_user_photo") || me.foto_profil || ""; } catch (e) { photo = ""; }
    }

    // 1. TopBar avatar button
    const topBarBtn = document.getElementById("topbar-user-avatar");
    if (topBarBtn) {
      if (photo) {
        topBarBtn.innerHTML = `<img src="${photo}" class="h-full w-full rounded-full object-cover" alt="Foto Profil">`;
      } else {
        topBarBtn.innerHTML = `<span data-user-initial="">${initial}</span>`;
      }
    }

    // 2. ViewAkun avatar preview & tombol hapus
    const akunAvatar = document.getElementById("akun-avatar-preview");
    if (akunAvatar) {
      if (photo) {
        akunAvatar.innerHTML = `<img src="${photo}" class="h-full w-full rounded-full object-cover" alt="Foto Profil">`;
      } else {
        akunAvatar.innerHTML = `<span data-user-initial="" class="text-2xl font-bold text-gold-300">${initial}</span>`;
      }
    }
    const btnHapus = document.getElementById("akun-btn-hapus-foto");
    if (btnHapus) {
      if (photo) btnHapus.classList.remove("hidden");
      else btnHapus.classList.add("hidden");
    }

    // 3. Sidebar user avatar
    const sidebarAvatar = document.getElementById("sidebar-user-avatar");
    if (sidebarAvatar) {
      if (photo) {
        sidebarAvatar.innerHTML = `<img src="${photo}" class="h-full w-full rounded-full object-cover" alt="Foto Profil">`;
      } else {
        sidebarAvatar.innerHTML = `<span data-user-initial="">${initial}</span>`;
      }
    }
  };

  window.akunUploadFoto = function (inputEl) {
    const el = (inputEl && inputEl.target) ? inputEl.target : inputEl;
    const file = (el && el.files) ? el.files[0] : null;
    if (!file) return;

    if (!file.type || !file.type.startsWith("image/")) {
      alert("Pilih berkas gambar yang valid (JPG, PNG, atau WebP).");
      try { el.value = ""; } catch (e) {}
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      alert("Ukuran berkas maksimal 5MB.");
      try { el.value = ""; } catch (e) {}
      return;
    }

    const msg = document.getElementById("akun-status-msg");
    if (msg) {
      msg.className = "text-[12px] font-semibold text-gold-600";
      msg.textContent = "Memproses gambar foto profil...";
    }

    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        try {
          const size = 240;
          const canvas = document.createElement("canvas");
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext("2d");

          // Potong otomatis persegi tengah (center square crop persis referensi DNZY SAKINAH)
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

          const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.85);
          try {
            localStorage.setItem("dnzy_user_photo", compressedDataUrl);
          } catch (err) { console.warn("LocalStorage save photo:", err); }

          window.renderUserAvatar(compressedDataUrl);

          if (msg) {
            msg.className = "text-[12px] font-semibold text-ku-700";
            msg.textContent = "Foto baru siap! Klik Simpan Profil untuk menyimpan.";
          }
          const btnHapus = document.getElementById("akun-btn-hapus-foto");
          if (btnHapus) btnHapus.classList.remove("hidden");

          try { el.value = ""; } catch (e) {}

          // Sinkronkan ke server jika tersedia
          try {
            if (typeof google !== "undefined" && google.script && google.script.run && typeof google.script.run.apiUpdateSetting === "function") {
              const token = (typeof KU !== "undefined" && KU.token) ? KU.token("erp") : "demo-token-ummu-aisyah";
              google.script.run
                .withSuccessHandler(function() { console.log("Foto profil tersinkron ke backend."); })
                .withFailureHandler(function(e) { console.warn("Gagal sinkron foto ke backend:", e); })
                .apiUpdateSetting(token, "USER_PHOTO_ADMIN", compressedDataUrl, "Foto Profil Admin");
            }
          } catch (syncErr) { console.warn("Sync photo err:", syncErr); }

          alert("Foto profil berhasil dipilih. Klik Simpan Profil untuk menyimpan.");
        } catch (err) {
          console.error(err);
          alert("Gagal memproses gambar: " + err.message);
        }
      };
      img.onerror = function () {
        alert("Gagal membaca file gambar. Silakan coba file lain.");
      };
      img.src = e.target.result;
    };
    reader.onerror = function () {
      alert("Gagal membaca berkas dari perangkat.");
    };
    reader.readAsDataURL(file);
  };

  window.akunSimpanProfil = function () {
    const photo = localStorage.getItem("dnzy_user_photo") || "";
    window.renderUserAvatar(photo);
    const msg = document.getElementById("akun-status-msg");
    if (msg) {
      msg.className = "text-[12px] font-semibold text-ku-700";
      msg.textContent = "Profil dan foto berhasil disimpan.";
    }
    try {
      if (photo && typeof google !== "undefined" && google.script && google.script.run && typeof google.script.run.apiUpdateSetting === "function") {
        const token = (typeof KU !== "undefined" && KU.token) ? KU.token("erp") : "demo-token-ummu-aisyah";
        google.script.run.apiUpdateSetting(token, "USER_PHOTO_ADMIN", photo, "Foto Profil Admin");
      }
    } catch (e) {}
    alert("Profil dan foto profil berhasil disimpan.");
  };

  window.akunHapusFoto = function () {
    if (!confirm("Hapus foto profil dan gunakan inisial huruf?")) return;
    try {
      localStorage.removeItem("dnzy_user_photo");
    } catch (err) {}
    window.renderUserAvatar("");
    const msg = document.getElementById("akun-status-msg");
    if (msg) {
      msg.className = "text-[12px] font-semibold text-inksoft";
      msg.textContent = "Foto profil dihapus (menggunakan inisial).";
    }
    alert("Foto profil telah dihapus.");
  };

  window.loadAkun = function () {
    const me = window.__erpMe || {};
    const u = $("#akun-username");
    if (u) u.textContent = me.username || "-";
    window.akunCekSyarat();
    renderAkunPersiapan();
    window.renderUserAvatar();
  };
  window.akunCekSyarat = () => renderSyarat($("#akun-syarat"), syaratSandi(nilai("akun-baru"), nilai("akun-ulang")));
  window.akunGantiSandi = async function () {
    const msg = $("#akun-msg");
    msg.className = "text-[12px] font-semibold text-danger";
    msg.textContent = "";
    const kurang = syaratSandi(nilai("akun-baru"), nilai("akun-ulang")).find(([ok]) => !ok);
    if (!nilai("akun-lama")) { msg.textContent = "Isi kata sandi saat ini."; return; }
    if (kurang) { msg.textContent = "Kata sandi baru belum memenuhi syarat: " + kurang[1].toLowerCase() + "."; return; }
    const btn = $("#akun-btn");
    btn.disabled = true;
    try {
      const res = await KU.erp.gantiPassword(nilai("akun-lama"), nilai("akun-baru"));
      if (!res.success) {
        msg.textContent = res.message || "Kata sandi belum tersimpan.";
        (window.dnzyToast || alert)(res.message || "Kata sandi belum tersimpan.", "error", 4000, "Gagal Ganti Sandi");
        return;
      }
      ["akun-lama", "akun-baru", "akun-ulang"].forEach((id) => setVal(id, ""));
      window.akunCekSyarat();
      msg.className = "text-[12px] font-semibold text-ku-700";
      msg.textContent = "Kata sandi diganti. Sesi di perangkat lain sudah keluar.";
      (window.dnzyToast || alert)("Kata sandi berhasil diganti. Sesi di perangkat lain sudah keluar.", "success", 4000, "Kata Sandi Baru");
    } catch (e) {
      msg.textContent = "Gagal terhubung ke server. Coba lagi.";
      (window.dnzyToast || alert)("Gagal terhubung ke server. Coba lagi.", "error", 4000, "Koneksi Gagal");
    } finally {
      btn.disabled = false;
    }
  };
})();

</script>
