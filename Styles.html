/* dnzy Umroh ERP Core Styles & Tailwind Bundle */

:root { --ease: cubic-bezier(0.32,0.72,0,1); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(4,31,23,0.18); border-radius: 8px; }

.nav-link { display: flex; align-items: center; gap: 0.75rem; border-radius: 0.75rem; padding: 0.625rem 0.75rem; font-size: 13px; font-weight: 500; color: rgba(250,248,243,0.6); transition: all 0.5s var(--ease); cursor: pointer; }
.nav-link:hover:not(.active) { background: rgba(250,248,243,0.07); color: rgba(250,248,243,0.9); }
.nav-link.active { background: #C8A24B; color: #041F17; }

.view { display: none; }
.view.active { display: block; animation: viewIn 0.5s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

@keyframes grow-bar { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.bar { transform-origin: bottom; animation: grow-bar 1s var(--ease) both; }
@keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
.pulse-dot { animation: pulse-dot 2s var(--ease) infinite; }
@keyframes fill-width { from { width: 0; } }
.fill-anim { animation: fill-width 1.2s var(--ease) both; }

/* Modern Toast Notification Animations */
@keyframes toastSlideIn { from { transform: translateY(-18px) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
@keyframes toastSlideOut { from { transform: translateY(0) scale(1); opacity: 1; } to { transform: translateY(-18px) scale(0.95); opacity: 0; } }
.toast-enter { animation: toastSlideIn 0.35s var(--ease) forwards; }
.toast-exit { animation: toastSlideOut 0.25s var(--ease) forwards; }

.card { border-radius: 1.5rem; background: rgba(255,255,255,0.7); padding: 0.5rem; box-shadow: 0 0 0 1px rgba(16,29,23,0.09); }
.card-in { border-radius: calc(1.5rem - 0.5rem); background: #FAF8F3; padding: 1.5rem; box-shadow: inset 0 1px 1px rgba(255,255,255,0.6); }
.card-dark { border-radius: 1.5rem; background: #041F17; padding: 0.5rem; box-shadow: 0 30px 70px -28px rgba(4,31,23,0.4); }
.card-dark-in { height: 100%; display: flex; flex-direction: column; border-radius: calc(1.5rem - 0.5rem); background: linear-gradient(to bottom, #093226, #041F17); padding: 1.5rem; }

.kpi-label { font-size: 10px; font-weight: 600; letter-spacing: 0.15em; color: #42544B; text-transform: uppercase; }
.kpi-val { margin-top: 0.5rem; font-family: 'Fraunces', serif; font-size: 26px; line-height: 1; font-weight: 500; }

.tbl { width: 100%; text-align: left; border-collapse: collapse; }
.tbl th { border-bottom: 1px solid rgba(16,29,23,0.09); padding: 0.75rem 1rem; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: rgba(66,84,75,0.7); text-transform: uppercase; text-align: inherit; }
.tbl th.text-right, .tbl td.text-right { text-align: right; }
.tbl td { padding: 0.875rem 1rem; font-size: 13px; }
.tbl tbody tr { border-bottom: 1px solid rgba(16,29,23,0.06); transition: background-color 0.5s var(--ease); }
.tbl tbody tr:hover { background: rgba(16,29,23,0.03); }
.tbl tbody tr:last-child { border-bottom: none; }

.badge { display: inline-flex; width: fit-content; align-items: center; gap: 0.375rem; border-radius: 9999px; padding: 4px 10px; font-size: 10px; font-weight: 700; }
.badge-ok { background: #E4EFE9; color: #005136; }
.badge-warn { background: #FFE8C2; color: #8a5a00; }
.badge-danger { background: #ffdad6; color: #ba1a1a; }
.badge-mute { background: rgba(66,84,75,0.1); color: rgba(66,84,75,0.7); }

.btn-primary { display: flex; align-items: center; gap: 0.625rem; border-radius: 9999px; background: #005136; padding: 0.625rem 0.625rem 0.625rem 1.25rem; font-size: 12px; font-weight: 600; color: #FAF8F3; transition: all 0.5s var(--ease); cursor: pointer; border: none; }
.btn-primary:hover { background: #06412F; }
.btn-primary:active { transform: scale(0.97); }
.btn-ghost { display: flex; align-items: center; gap: 0.5rem; border-radius: 9999px; border: 1px solid rgba(16,29,23,0.09); background: rgba(255,255,255,0.7); padding: 0.625rem 1.25rem; font-size: 12px; font-weight: 600; color: #101D17; transition: all 0.5s var(--ease); cursor: pointer; }
.btn-ghost:hover { border-color: rgba(0,81,54,0.4); }
.btn-ghost:active { transform: scale(0.97); }
.btn-gold { display: flex; align-items: center; gap: 0.375rem; border-radius: 9999px; background: #041F17; padding: 0.5rem 1rem; font-size: 11px; font-weight: 700; color: #D9BE79; transition: all 0.5s var(--ease); cursor: pointer; border: none; }
.btn-gold:hover { background: #000; }
.btn-gold:active { transform: scale(0.96); }

.btn-sm { display: flex; height: 2rem; width: 2rem; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 9999px; border: 1px solid rgba(16,29,23,0.12); background: #fff; color: #42544B; transition: background-color 0.3s var(--ease), border-color 0.3s var(--ease), color 0.3s var(--ease); cursor: pointer; }
.btn-sm i { font-size: 16px; }
.btn-sm:hover { border-color: rgba(0,81,54,0.35); background: #E4EFE9; color: #005136; }
.btn-sm:focus-visible { outline: 2px solid #005136; outline-offset: 2px; }
.btn-sm:active { transform: scale(0.94); }

.f-label { display: block; margin-bottom: 0.375rem; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; color: #42544B; text-transform: uppercase; }
.f-input { width: 100%; border-radius: 0.75rem; border: 1px solid rgba(16,29,23,0.09); background: #fff; padding: 0.625rem 1rem; font-size: 13px; color: #101D17; outline: none; font-family: inherit; }
.f-input:focus { border-color: #005136; }

.modal-overlay { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.4s var(--ease), visibility 0s linear 0.4s; position: fixed; inset: 0; z-index: 50; background: rgba(4,31,23,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 1rem; }
.modal-overlay.open { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 0.4s var(--ease), visibility 0s; }
.modal-card { transform: translateY(24px) scale(0.98); transition: transform 0.5s var(--ease); }
.modal-overlay.open .modal-card { transform: translateY(0) scale(1); }

/* Custom Overrides & Layout Guarantees for dnzy Umroh ERP */
:root {
  --ku-dark: #041F17;
  --ku-gold: #C8A24B;
  --ku-cream: #FAF8F3;
}

html, body {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  color: #101D17;
}

#sidebar {
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  width: 248px;
  height: 100vh;
  z-index: 40;
  display: flex;
  flex-direction: column;
  background-color: #041F17;
  color: rgba(250, 248, 243, 0.88);
  transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
}

#sidebar nav {
  flex: 1 1 0%;
  min-height: 0;
  overflow-y: auto;
}

.font-display {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600 !important;
  letter-spacing: -0.01em;
}

.kpi-label {
  font-size: 11.5px !important;
  font-weight: 700 !important;
  letter-spacing: 0.08em !important;
  color: #26382F !important;
}

.kpi-val {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 26px;
  line-height: 1.15;
  font-weight: 600 !important;
}

.tbl th {
  font-size: 11.5px !important;
  font-weight: 700 !important;
  letter-spacing: 0.08em !important;
  color: #26382F !important;
}

.tbl td {
  font-size: 13.5px !important;
  color: #101D17;
}

.f-label {
  font-size: 11.5px !important;
  font-weight: 700 !important;
  letter-spacing: 0.04em !important;
  color: #26382F !important;
}

.badge {
  font-size: 11px !important;
  font-weight: 700 !important;
}

.nav-link {
  font-size: 13.5px !important;
  font-weight: 500 !important;
  color: rgba(250, 248, 243, 0.85) !important;
}
.nav-link:hover:not(.active) {
  background: rgba(250, 248, 243, 0.1) !important;
  color: #FAF8F3 !important;
}
.nav-link.active {
  background: #C8A24B !important;
  color: #041F17 !important;
  font-weight: 700 !important;
}

/* High-contrast readability overrides for muted text & small sizes */
.text-inksoft,
.text-inksoft\/70,
.text-inksoft\/60 {
  color: #2D4037 !important;
}
.text-inksoft\/50,
.text-inksoft\/40,
.text-inksoft\/30,
.\!text-inksoft\/30,
.\!text-inksoft\/40,
.text-ink\/50 {
  color: #465A50 !important;
}
.placeholder\:text-inksoft\/50::placeholder,
input::placeholder,
textarea::placeholder {
  color: #52665C !important;
  opacity: 1 !important;
}

.text-cream\/35,
.text-cream\/40,
.text-cream\/50,
.text-cream\/55,
.text-cream\/60,
.text-cream\/70 {
  color: rgba(250, 248, 243, 0.82) !important;
}

.text-gold-600,
.\!text-gold-600 {
  color: #7A5811 !important;
  font-weight: 600;
}

.text-\[8px\],
.text-\[9px\],
.\!text-\[9px\] {
  font-size: 11px !important;
}
.text-\[10px\],
.\!text-\[10px\],
.text-\[10\.5px\] {
  font-size: 11.5px !important;
}
.text-\[11px\],
.\!text-\[11px\],
.text-\[11\.5px\] {
  font-size: 12px !important;
}

@media (min-width: 1024px) {
  #sidebar {
    transform: translateX(0) !important;
  }
  main {
