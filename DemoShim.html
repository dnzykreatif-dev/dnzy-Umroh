    // -- ERP: PEMBAYARAN --
    if (route === "pembayaran" && method === "GET") return ok({ items: d.pembayaran.map((p) => ({ ...p, nama_jamaah: p.nama_jamaah || p.jamaah_nama || (d.jamaah.find((x) => x.id_jamaah === p.jamaah_id) || {}).nama || p.jamaah_id })), pagination: { page: 1, per_page: 10, total: d.pembayaran.length, total_pages: 1 } });

    if (route === "pembayaran" && method === "POST") {
      if (!["Uang Muka", "Cicilan", "Pelunasan"].includes(body.jenis === "Uang Muka (DP)" ? "Uang Muka" : body.jenis)) return fail("Jenis pembayaran tidak valid.");
      const p = { id_bayar: "INV-" + Math.floor(10000 + Math.random() * 89999) + "-" + Math.floor(1000 + Math.random() * 8999), tanggal: daysAgo(0), nama_jamaah: (d.jamaah.find((x) => x.id_jamaah === body.jamaah_id) || {}).nama || body.jamaah_id, ...body, jenis: body.jenis === "Uang Muka (DP)" ? "Uang Muka" : body.jenis };

    if (seg[0] === "pembayaran" && seg[2] === "kuitansi") return new Response(new Blob(["%PDF-1.4\n% Demo KelolaUmroh - kuitansi " + seg[1] + " (mode demo tanpa server)."], { type: "application/pdf" }), { status: 200 });
    if (seg[0] === "export" && seg[1] === "pembayaran") {
      const csv = "\uFEFFid_bayar,jamaah_id,jadwal_id,tanggal,nominal,jenis\n" + d.pembayaran.map((p) => [p.id_bayar, p.jamaah_id, p.jadwal_id, p.tanggal, p.nominal, p.jenis].join(",")).join("\n");
      return new Response(new Blob([csv], { type: "text/csv" }), { status: 200, headers: { "Content-Disposition": 'attachment; filename="export-pembayaran-demo.csv"' } });
    }
    if (seg[0] === "pembayaran" && seg.length === 2 && method === "DELETE") { d.pembayaran = d.pembayaran.filter((x) => x.id_bayar !== seg[1]); save(d); return ok({ deleted: true }, "Kwitansi dihapus."); }

    // -- ERP: AGEN --
    if (route === "agen" && method === "GET") {
      const status = new URLSearchParams(path.split("?")[1] || "").get("status");

      return ok(d.agen.filter((a) => (!status || a.status_akun === status) && (sesi.entitas === "PST-01" || (a.id_entitas || "PST-01") === sesi.entitas)).map((a) => demoAgenRow(d, a)));
    }
    // Paritas AgenController (komisi tier): tier aktif dari entitas agen wajib; perekrut opsional, aktif, satu entitas
    const demoTierSah = (idTier, ent) => {
      const t = demoTier(d, idTier);
      if (!t || t.id_entitas !== ent) return "Pilih tier agen dari entitas agen itu.";
      return t.aktif ? t : `Tier ${t.nama} sudah nonaktif. Pilih tier lain.`;
    };
    const demoPerekrutSah = (up, ent, idAgen) => {
      let p = d.agen.find((x) => x.id_agen === up);
      if (!p) return "Perekrut tidak ditemukan.";
      if (p.status_akun !== "AKTIF") return "Perekrut tidak aktif.";
      if ((p.id_entitas || "PST-01") !== ent) return "Perekrut harus dari entitas yang sama dengan agen.";

      if (tolak) return fail(tolak);
      const { pin, ...isi } = body;
      const a = { id_agen: nextId("AGN"), status_akun: "AKTIF", ...isi, id_tier: t.id, role: demoRoleLama(t.urutan), id_upline: body.id_upline || null, id_entitas: ent, nama: (body.nama || "").toUpperCase() };

    const demoBolehUbahTier = (en) => demoRole() === "OWNER" || (en.tipe_entitas === "CABANG" && demoRole() === "KEPALA_ENTITAS" && DEMO_ROLES.KEPALA_ENTITAS.entitas === en.id);
    if (route === "komisi-tier" && method === "GET") {

      const cabang = en.tipe_entitas === "CABANG";

          batas_per_jenis: cabang ? { ...((d.komisi_cabang_jenis || {})[en.id] || {}) } : null },

      const masuk = Array.isArray(body.tiers) ? body.tiers : [];

      const nama = new Set();

      for (const t of masuk) {

      const lama = demoTiers(d, en.id);
      for (const t of baru) {

        const pakai = d.agen.filter((a) => Number(a.id_tier) === t.id && a.status_akun === "AKTIF").length;

      }

      d.tier_agen = d.tier_agen.filter((t) => t.id_entitas !== en.id).concat(baru.map((t, i) => ({ ...t, id: t.id || ++id, id_entitas: en.id, urutan: i + 1 })));

      const margin = demoJenisPaket(d);
      const peringatan = en.tipe_entitas === "CABANG" ? [] : baru.filter((t) => t.aktif).flatMap((t) => Object.entries(margin)
        .filter(([j, m]) => m !== null && (demoNominalTier(t, j) ?? -1) > m)
        .map(([j, m]) => `${t.nama} paket ${j}: komisi Rp${Intl.NumberFormat("id-ID").format(demoNominalTier(t, j))} melebihi margin terkecil Rp${Intl.NumberFormat("id-ID").format(m)}, jadi pendaftaran di jadwal itu akan ditolak.`));
      return ok({ tiers: demoTiers(d, en.id).map((t) => ({ ...t, jumlah_agen: d.agen.filter((a) => Number(a.id_tier) === t.id && a.status_akun === "AKTIF").length })), peringatan },
        "Komisi tier disimpan. Berlaku untuk pendaftaran berikutnya.");
    }

    // -- ERP: baca KTP/paspor di perangkat (26 Okt 2026): demo = lisensi Growth tanpa API key Gemini -> Tesseract di browser --
    if (route === "ocr/mode") {
      const tersedia = (DEMO_RBAC.perms[demoRole()] || []).includes("OCR_USE");
      return ok({ tersedia, mode: tersedia ? "perangkat" : null });
    }

      const konflik = demoMelebihiBatas(d, seg[1], null, per);

    // -- ERP: INTEGRASI (Gemini/Fonnte) - DM-1 (demo tanpa koneksi) --

    // -- Push notification (paritas PushController, 24 Okt 2026). Demo tidak punya server push: portal hanya menampilkan

    if (route === "agent/push" || route === "jamaah-portal/push") return ok({ kunci_publik: "", perangkat: 0, demo: true });

    if (route === "push" && method === "GET") {

      const riwayat = d.pengumuman || [];

          return t ? { jadwal_id: t.jadwal_id, nama_paket: t.nama_paket, jenis_paket: t.jenis_paket } : null; })() },
      });
    }

    // -- Fallback --
    console.warn("[DemoShim] unhandled:", method, path, "-> empty success");

  // -------------------------------------------------------------

    const s = p.toString();

    onboardingAksi: async () => fail("tidak disimpan."),

    listJamaah: (params) => request(app, "GET", "/jamaah" + qs(params)),

    createJamaah: (data) => request(app, "POST", "/jamaah", data),
